name: 原文取得（開発用）

# e-Gov から原文XMLを取り、成果物（Artifact）として保存するだけ。サイトには触らない。
on:
  workflow_dispatch:
    inputs:
      only:
        description: '取得する法令の key（空白区切り。空なら全部）'
        type: string
        default: ''

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 取得
        run: |
          if [ -n "${{ inputs.only }}" ]; then
            python scripts/fetch_laws.py --only ${{ inputs.only }}
          else
            python scripts/fetch_laws.py
          fi
      # 開発で原文を見られるよう、raw ブランチに置く（main・サイトには影響しない）
      - name: raw ブランチに置く
        run: |
          cd data/raw
          git init -q -b raw
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "原文XML $(date -u +%F)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" raw
